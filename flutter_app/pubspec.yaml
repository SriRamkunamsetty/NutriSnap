name: nutrisnap_app
description: NutriSnap AI - private, on-device nutrition tracking powered by Gemma.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  flutter_animate: ^4.2.0+1
  go_router: ^13.1.0
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0
  image_picker: ^1.0.4
  intl: 0.20.2
  equatable: ^2.0.5
  flutter_gemma: ^1.11.2
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  flutter_gemma_litertlm: ^1.8.5
  lucide_icons_flutter: ^3.1.20
  crypto: ^3.0.7
  wakelock_plus: ^1.8.0
  image: ^4.10.1
  health: 13.3.2
  pedometer: ^4.2.0
  permission_handler: 11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
